name: Deploy docs to GitHub Pages

# Builds the Vite + React + TS docs app (docs/ -> docs/dist) and deploys it
# as the GitHub Pages site (https://ojaj.docs.potenfyr.in). Pull requests
# build only, they never deploy.

on:
  push:
    branches: [ master ]
    paths:
      - docs/**
      - .github/workflows/docs-pages.yml
  pull_request:
    branches: [ master ]
    paths:
      - docs/**
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build docs site
        working-directory: docs
        run: |
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          case "$BASE_URL" in
            ""|*github.io*) export VITE_BASE="/ojaj/" ;;
            *) export VITE_BASE="/" ;;
          esac
          bun install --frozen-lockfile
          bun run build

      - name: Verify emitted routes
        run: |
          for f in index.html about.html examples.html docs/index.html docs/getting-started.html \
                   docs/gameplay.html docs/configuration.html \
                   docs/commands-permissions.html docs/faq.html \
                   about/index.html examples/index.html docs/faq/index.html \
                   og.png CNAME robots.txt sitemap.xml; do
            test -f "docs/dist/$f" || { echo "::error::missing docs/dist/$f"; exit 1; }
          done
          echo "All routes present."

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
