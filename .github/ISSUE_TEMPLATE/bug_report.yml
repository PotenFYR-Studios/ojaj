name: Bug report
description: Something in the chaos broke
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below.
        Check the [FAQ](https://ojaj.docs.potenfyr.in/docs/faq.html) first, especially the
        world-name gotcha: the default config only whitelists the worlds `world` and `spawn`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Jump trigger / launch behavior
        - Effects (particles, sounds, titles, action bar, broadcast)
        - Configuration
        - Commands & permissions
        - World filtering
        - Performance
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Join world '...'
        2. Set config to '...'
        3. Jump
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.0-alpha
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software and version
      description: "Paper, Purpur or a fork, with the Minecraft version"
      placeholder: Paper 26.1.2
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config.yml section
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Console/log output
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the FAQ and documentation
        - label: I am running Paper or Purpur (not Spigot)
        - label: The issue reproduces without other plugins (or I tested for conflicts)
